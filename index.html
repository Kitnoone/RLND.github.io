<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d2b30">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Легенды подземелий — интерактивные карточки</title>
  <style>
    html,body{height:100%;margin:0;background:#22201c;color:#efe9dd;font-family:Arial,sans-serif}
    .loader{min-height:100%;display:grid;place-items:center;padding:24px;text-align:center}
    .loader-box{max-width:560px;border:1px solid #b08a3e;background:#0d2b30;padding:24px}
    .loader h1{margin:0 0 12px;font-size:26px}.loader p{line-height:1.5;color:#d8d2c4}
    .error{color:#ffd5cf}
  </style>
</head>
<body>
  <main class="loader"><div class="loader-box"><h1>Легенды подземелий</h1><p id="status">Загружаю карточки…</p></div></main>
  <script>
  (async () => {
    const status = document.getElementById('status');
    try {
      const response = await fetch('./legendy-kartochki-igrovye.html', {cache: 'no-store'});
      if (!response.ok) throw new Error('Не найден legendy-kartochki-igrovye.html');
      let html = await response.text();
      const additionsHead = '<meta name="theme-color" content="#0d2b30"><link rel="manifest" href="./manifest.webmanifest">';
      const additionsBody = '<script src="./legends-interactive.js" defer><\/script>';
      html = html.includes('</head>') ? html.replace('</head>', additionsHead + '</head>') : additionsHead + html;
      html = html.includes('</body>') ? html.replace('</body>', additionsBody + '</body>') : html + additionsBody;
      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      status.className = 'error';
      status.innerHTML = 'Не удалось открыть исходную v2.<br>Положите файл <b>legendy-kartochki-igrovye.html</b> рядом с index.html и открывайте сайт через HTTPS.';
      console.error(error);
    }
  })();
  </script>
</body>
</html>
